[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qecsim"
version = "0.1.0"
description = "A NumPy quantum error-correction simulator: bit-flip, phase-flip and Shor codes under configurable Pauli noise, with Monte Carlo logical error rates."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.6"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
dev = ["pytest>=7.0", "qiskit>=1.0"]

[tool.setuptools]
packages = ["qecsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
